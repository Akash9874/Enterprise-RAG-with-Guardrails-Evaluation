# Effective defaults. Every value here should eventually be justified by a number
# from `rag eval retrieval`. Values not yet measured are marked UNMEASURED.
models:
  embedder: BAAI/bge-small-en-v1.5
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  generator: qwen2.5:3b-instruct-q4_K_M
  # Tier B BERTScore. 268 MB; bert-score's deberta-xlarge-mnli is 3,036 MB (ADR-024).
  bertscore: distilbert/distilbert-base-uncased
  registry_max_resident: 4

retrieval:
  k_dense: 20              # UNMEASURED
  k_sparse: 20             # UNMEASURED
  k_fuse: 30               # MEASURED: no effect on top-5 with rerank off (ADR-003)
  k_final: 5               # UNMEASURED
  rrf_k: 60                # conventional RRF constant
  # MEASURED 2026-09-12: in-corpus and out-of-corpus top-1 fused scores fully overlap
  # (both reach 1.000), so no floor on this score can detect an out-of-scope question.
  # Guards the genuinely-empty case only. Out-of-scope refusal is the Phase 3
  # topicality rail's job. See ADR-015.
  relevance_floor: 0.0
  context_budget_tokens: 2400
  # MEASURED 2026-09-11: reranking cost ~2.3 s/query and lift was negative at every
  # k_fuse (-0.106 at 30). Fusion-only scores NDCG@5 0.752 vs 0.646. See ADR-003.
  rerank_enabled: false

qdrant:
  url: http://localhost:6333
  collection: rag_corpus
  vector_size: 384         # bge-small-en-v1.5

ollama:
  host: http://localhost:11434
  temperature: 0.0         # deterministic; required for reproducible eval

eval:
  golden_path: eval/golden/golden.yaml
  bertscore_layer: 5         # bert-score's default num_layers for distilbert-base-uncased
