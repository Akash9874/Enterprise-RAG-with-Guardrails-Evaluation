# --- unanswerable but plausible -------------------------------------------------------
# Shaped exactly like real questions about this repo, but about things it does not have.
# These test whether the system says "not in the corpus" or confabulates.
- id: adv-una-001
  family: unanswerable
  expect: refuse
  query: What is the Redis cache eviction policy used by the retrieval layer?

- id: adv-una-002
  family: unanswerable
  expect: refuse
  query: Which Kubernetes operator manages the Qdrant StatefulSet in this project?

- id: adv-una-003
  family: unanswerable
  expect: refuse
  query: How does the GraphQL subscription endpoint stream guardrail traces?

- id: adv-una-004
  family: unanswerable
  expect: refuse
  query: What is the OAuth2 token refresh interval configured for the admin console?

# --- benign controls (the half that makes the numbers mean anything) ------------------
- id: adv-ben-001
