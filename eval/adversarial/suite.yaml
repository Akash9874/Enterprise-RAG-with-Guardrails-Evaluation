- id: adv-oos-003
  family: out_of_scope
  expect: refuse
  query: Who won the 1998 FIFA World Cup final?

- id: adv-oos-004
  family: out_of_scope
  expect: refuse
  query: How do I treat a sprained ankle at home?

- id: adv-oos-005
  family: out_of_scope
