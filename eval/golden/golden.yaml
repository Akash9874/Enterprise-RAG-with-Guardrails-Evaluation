# Golden set. Hand-authored entries: ground truth is known because the author wrote the
# source. Target: ~25 hand + ~25 synthetic. Score the halves separately — never pool them.
#
# relevant_chunk_ids is used when present; relevant_files otherwise. golden_answer is the
# BERTScore reference for Tier B — it states only what the relevant source says.
# This file is never indexed (ADR-023).

- id: q-h001
  query: How does the retriever combine dense and sparse results?
  provenance: hand
  relevant_files: [src/rag/retrieval/hybrid.py]
  golden_answer: >-
    The dense and sparse queries run as prefetch branches in Qdrant and are fused server-side
    with Reciprocal Rank Fusion in one round trip. Results are ordered by fused score, with
    ties broken by chunk_id.

- id: q-h002
  query: Why was bge-reranker-large rejected?
  provenance: hand
  relevant_files: [Docs/decisions.md]
  golden_answer: >-
    bge-reranker-large has 560M parameters and costs roughly two seconds per query to score
    30 candidates on this CPU, so the 22M ms-marco-MiniLM-L-6-v2 cross-encoder was chosen
    instead.

- id: q-h003
  query: What keeps ingestion idempotent across runs?
  provenance: hand
  relevant_files: [src/rag/contracts.py]
  golden_answer: >-
    Every chunk gets a stable, content-derived chunk_id hashed from its source path and text,
    so re-ingesting unchanged content yields the same id and golden-set references stay valid.

- id: q-h004
  query: How are markdown chunks given readable citations?
  provenance: hand
  relevant_files: [src/rag/ingest/chunkers/markdown.py]
  golden_answer: >-
    Markdown is split on headers and each chunk keeps its full header trail, joined with " > ",
    as header_path, so a citation reads like "Architecture > Retrieval" rather than a line range.

- id: q-h005
  query: What prevents a transformer from loading at import time?
  provenance: hand
  relevant_files: [src/rag/models/registry.py]
  golden_answer: >-
    The model registry only records a loader when a model is registered and builds the model on
    first use, evicting the least recently used model when too many are resident.

- id: q-h006
  query: Which files are skipped when walking the repository?
  provenance: hand
  relevant_files: [src/rag/ingest/loaders.py]
  golden_answer: >-
    The loader skips files matched by .gitignore, anything under dot directories or folders such
    as .git, .venv, node_modules, caches and qdrant_storage, the eval directory, files with an
    unknown extension, and files that are not valid UTF-8.

- id: q-h007
  query: How does the code chunker find function and class boundaries?
  provenance: hand
  relevant_files: [src/rag/ingest/chunkers/code.py]
  golden_answer: >-
    Python is parsed with tree-sitter and chunks are cut at function, class and decorated
    definitions. Oversized definitions are split on line boundaries with a continuation label,
    and other languages or unparseable files fall back to a whole-file chunk.

- id: q-h008
  query: What symbol path does a method inside a class get?
  provenance: hand
  relevant_files: [src/rag/ingest/chunkers/code.py]
  golden_answer: >-
    A method is given the enclosing class name and its own name joined with a dot, such as
    HybridRetriever.search, and nested classes chain further with dots.

- id: q-h009
  query: Why do sparse vectors use the IDF modifier?
  provenance: hand
  relevant_files: [src/rag/index/schema.py]
  golden_answer: >-
    The IDF modifier makes the sparse vectors behave as BM25 rather than as raw term counts.

- id: q-h010
  query: How is a Qdrant point id derived from a chunk id?
  provenance: hand
  relevant_files: [src/rag/index/schema.py]
  golden_answer: >-
    Qdrant needs a UUID or unsigned integer, so the point id is a deterministic UUID5 derived
    from the chunk_id, which keeps upserts idempotent.

- id: q-h011
  query: What instruction prefix do bge models need, and on what?
  provenance: hand
  relevant_files: [src/rag/models/embedder.py]
  golden_answer: >-
    Queries only are prefixed with "Represent this sentence for searching relevant passages: ".
    Applying the prefix to documents, or omitting it on queries, silently degrades recall.

- id: q-h012
  query: How does the health endpoint report dependency readiness?
  provenance: hand
  relevant_files: [src/rag/api/routes/health.py]
  golden_answer: >-
    GET /health checks whether Qdrant and Ollama are ready and returns status ok or degraded
    with per-dependency booleans. It returns HTTP 200 even when degraded, because a dependency
    being down is information, not a transport error.

- id: q-h013
  query: How is configuration layered between YAML, env vars and defaults?
  provenance: hand
  relevant_files: [src/rag/config.py]
  golden_answer: >-
    Precedence, highest first, is init arguments, then RAG_-prefixed environment variables, then
    config/settings.yaml, then field defaults, so the environment always beats the file.

- id: q-h014
  query: What is the resident memory budget for models?
  provenance: hand
  relevant_files: [CLAUDE.md, Docs/prd.md]
  golden_answer: >-
    The resident model budget is about 5 GB of the machine's 15.4 GB of RAM, and exceeding 6 GB
    is treated as a defect.

- id: q-h015
  query: How does context assembly enforce the token budget?
  provenance: hand
  relevant_files: [src/rag/retrieval/context.py]
  golden_answer: >-
    Chunks are ordered by score, duplicates and chunks subsumed by a kept chunk from the same file
    are dropped, and whole chunks that would exceed the budget are skipped rather than truncated.

- id: q-h016
  query: Why are chunks never truncated mid-text?
  provenance: hand
  relevant_files: [src/rag/retrieval/context.py, src/rag/retrieval/CLAUDE.md]
  golden_answer: >-
    A half-function or half-section produces confidently wrong answers, the worst failure for a
    system whose headline feature is groundedness, so the budget is met by dropping whole chunks.

- id: q-h017
  query: How is reranker lift defined and measured?
  provenance: hand
  relevant_files: [src/rag/eval/CLAUDE.md]
  golden_answer: >-
    Reranker lift is NDCG@k with reranking enabled minus NDCG@k with it disabled, over the same
    query set and the same fused candidates.

- id: q-h018
  query: Why are hand-authored and synthetic golden queries never pooled?
  provenance: hand
  relevant_files: [src/rag/eval/golden.py, src/rag/eval/CLAUDE.md]
  golden_answer: >-
    Synthetic questions are generated from the chunk that answers them, so their lexical overlap
    is artificially high. Pooling them with hand-authored questions would flatter the system.

- id: q-h019
  query: What must every evaluation report carry to be valid?
  provenance: hand
  relevant_files: [src/rag/eval/CLAUDE.md, CLAUDE.md]
  golden_answer: >-
    Every report must carry provenance: the judge model, the corpus commit SHA, the model
    versions and the config hash. A report without it is invalid and must not be committed.

- id: q-h020
  query: How is NDCG at k computed, and where are the off-by-one errors?
  provenance: hand
  relevant_files: [src/rag/eval/CLAUDE.md]
  golden_answer: >-
    NDCG@k is DCG@k divided by IDCG@k, where DCG sums rel_i / log2(i + 1) with i 1-indexed and
    IDCG is computed over the ideal ordering truncated to k. The 1-indexing and the truncation
    are the common off-by-one errors.

- id: q-h021
  query: How does the LLM client talk to Ollama?
  provenance: hand
  relevant_files: [src/rag/models/llm.py]
  golden_answer: >-
    OllamaClient calls the Ollama chat API with the configured generator model, an optional
    system message and the configured temperature, with an explicit timeout, and can stream
    content deltas.

- id: q-h022
  query: What are the default k values for retrieval?
  provenance: hand
  relevant_files: [config/settings.yaml, src/rag/config.py]
  golden_answer: >-
    The defaults are k_dense 20, k_sparse 20, k_fuse 30 and k_final 5, with an RRF constant of 60.

- id: q-h023
  query: Why is fusion done server-side instead of in Python?
  provenance: hand
  relevant_files: [src/rag/retrieval/CLAUDE.md]
  golden_answer: >-
    Server-side RRF takes one round trip and avoids a client-side BM25 index that would need
    keeping in sync with Qdrant, use in-process memory, and be rebuilt on every restart.

- id: q-h024
  query: How are quarantined chunks handled during retrieval?
  provenance: hand
  relevant_files: [src/rag/retrieval/CLAUDE.md, src/rag/index/qdrant_store.py]
  golden_answer: >-
    Chunks the injection classifier flagged at ingest are marked quarantined and excluded from
    retrieval by default through a filter on the quarantined payload field.

- id: q-h025
  query: Why is a guardrail refusal returned as HTTP 200?
  provenance: hand
  relevant_files: [CLAUDE.md]
  golden_answer: >-
    A guardrail refusal is a correct outcome, not an error, so it is returned as HTTP 200 with
    the refusal recorded in the trace.

- id: q-h026
  query: How does the ingestion pipeline deduplicate chunks?
  provenance: hand
  relevant_files: [src/rag/ingest/pipeline.py]
  golden_answer: >-
    The pipeline tracks the chunk_ids it has already emitted and skips any chunk whose id has
    been seen.

- id: q-h027
  query: What ties are broken deterministically in retrieval ordering?
  provenance: hand
  relevant_files: [src/rag/retrieval/hybrid.py, src/rag/retrieval/CLAUDE.md]
  golden_answer: >-
    Results with equal fused or rerank scores are ordered by chunk_id, never by insertion order,
    so Tier A evaluation is bit-reproducible.

- id: q-h028
  query: Which Python version is pinned and why not the system Python?
  provenance: hand
  relevant_files: [CLAUDE.md]
  golden_answer: >-
    Python 3.12 is pinned through uv because the system Python 3.14 is ahead of wheel
    availability for spacy, presidio and torch.

