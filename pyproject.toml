[project]
name = "enterprise-rag"
version = "0.1.0"
description = "CPU-only RAG with tiered guardrails and deterministic evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "ollama>=0.4",
    "structlog>=24.4",
    "typer>=0.15",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sentence-transformers>=3.3",
    "fastembed>=0.5",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "langchain-text-splitters>=0.3",
    "pathspec>=0.12",
    "rich>=13.9",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "transformers<5",
    "numpy>=1.26",
    "jinja2>=3.1",
    # Declared directly only so [tool.uv.sources] can route it: uv sources apply to direct
    # dependencies, and PyPI's Linux wheel pulls 15 CUDA packages this project cannot use.
    "torch>=2.5",
]

[project.scripts]
rag = "rag.cli:app"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "psutil>=7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Ruff >=0.16 formats Python code blocks inside Markdown. Plan documents contain partial
# snippets (method bodies meant to be pasted into a class), which it de-indents to module
# level and corrupts. Docs are prose, not a build target — keep ruff out of them.
exclude = ["Docs"]

[tool.ruff.lint]
# BLE flags blind `except Exception`. Readiness checks and provenance collection must
# never raise, so they suppress it explicitly at the call site with a reason.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads a real model or hits a live service",
    "integration: requires Qdrant or Ollama running",
]
addopts = "-q --strict-markers"
