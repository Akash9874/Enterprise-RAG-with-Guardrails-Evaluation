name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      - name: Test
        run: uv run pytest -m "not slow and not integration" --cov=rag --cov-report=term-missing

  retrieval-gate:
    # FR-E7. Tier A only: it needs Qdrant and the encoders, not a 1.9 GB generator.
    # The Tier B groundedness gate runs locally via `rag eval gate` (ADR-026).
    runs-on: ubuntu-latest
    needs: quality
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # corpus_commit provenance needs real history

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        # --locked: a lockfile rewrite would dirty the tree, stamp corpus_commit "-dirty",
        # and make the CI report impossible to promote as a baseline.
        run: uv sync --locked --dev

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: .cache
          key: models-${{ hashFiles('config/settings.yaml', 'config/guardrails.yaml') }}

      - name: Wait for Qdrant
        run: timeout 60 bash -c 'until curl -sf http://localhost:6333/readyz; do sleep 2; done'

      - name: Index this repository
        # The injection scan stays on: it quarantines 29 chunks, some of them real code
        # (ADR-023). Skipping it would gate a different corpus from the one the product serves.
        run: uv run rag ingest --source .

      - name: Tier A
        run: uv run rag eval retrieval --no-lift --out eval/reports/ci.json

      - name: Regression gate
        run: uv run rag eval gate eval/reports/ci.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/ci.json
